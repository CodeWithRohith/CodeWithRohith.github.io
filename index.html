    // --- DARK MODE HOOK (DEFAULT = DAY MODE) ---
    const useDarkMode = () => {
      const [isDarkMode, setIsDarkModeState] = useState(false);

      useEffect(() => {
        const savedMode = localStorage.getItem('darkMode');
        setIsDarkModeState(savedMode === 'enabled');
      }, []);

      useEffect(() => {
        if (isDarkMode) {
          document.body.classList.add('dark');
          localStorage.setItem('darkMode', 'enabled');
        } else {
          document.body.classList.remove('dark');
          localStorage.setItem('darkMode', 'disabled');
        }
      }, [isDarkMode]);

      const toggleDarkMode = useCallback(() => setIsDarkModeState(p => !p), []);
      return { isDarkMode, toggleDarkMode };
    };

    // --- INTERACTIVE 3D TILT GLASS CARD COMPONENT ---
    const TiltCard = ({ children, className = '', onClick }) => {
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        
        const rotateX = ((y - centerY) / centerY) * -6;
        const rotateY = ((x - centerX) / centerX) * 6;

        cardRef.current.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
        cardRef.current.style.setProperty('--mouse-x', `${x}px`);
        cardRef.current.style.setProperty('--mouse-y', `${y}px`);
      };

      const handleMouseLeave = () => {
        if (!cardRef.current) return;
        cardRef.current.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          onClick={onClick}
          className={`tilt-glass-card ${onClick ? 'cursor-pointer' : ''} ${className}`}
        >
          {children}
        </div>
      );
    };

    // --- APPLE VISION OS STYLE GLASS BUTTON COMPONENT ---
    const Button = ({ children, variant = 'primary', size = 'md', href, download, className = '', leftIcon, rightIcon, target, rel, ...props }) => {
      const baseStyles = "relative inline-flex items-center justify-center font-display font-semibold transition-all duration-300 transform active:translate-y-0 overflow-hidden shrink-0";

      const sizeStyles = {
        sm: "px-4 py-2 text-xs uppercase tracking-wider",
        md: "px-6 py-3 text-sm uppercase tracking-wider",
        lg: "px-8 py-4 text-base uppercase tracking-widest"
      };

      const variantStyles = {
        primary: "apple-glass-button apple-glass-button-primary",
        outline: "apple-glass-button",
        ghost: "text-slate-700 dark:text-slate-300 hover:bg-black/5 dark:hover:bg-white/10 rounded-full",
      };

      const combinedClassName = `${baseStyles} ${sizeStyles[size]} ${variantStyles[variant]} ${className}`;

      if (href) {
        const finalTarget = target !== undefined ? target : (href.startsWith('#') || download ? undefined : "_blank");
        const finalRel = rel === undefined && finalTarget === "_blank" ? "noopener noreferrer" : rel;

        return (
          <a href={href} className={combinedClassName} {...(download && { download })} target={finalTarget} rel={finalRel} onClick={props.onClick}>
            {leftIcon && <span className="mr-2">{leftIcon}</span>}
            {children}
            {rightIcon && <span className="ml-2">{rightIcon}</span>}
          </a>
        );
      }

      return (
        <button className={combinedClassName} {...props}>
          {leftIcon && <span className="mr-2">{leftIcon}</span>}
          {children}
          {rightIcon && <span className="ml-2">{rightIcon}</span>}
        </button>
      );
    };

    const ProjectsSection = ({ data }) => (

    const ExtraCurricularSection = ({ data }) => (

    const ContactSection = ({ data }) => (
      <TiltCard className="text-center py-12 px-6 sm:px-12">
        <h3 className="font-display font-extrabold text-3xl sm:text-5xl text-gradient-art mb-6">Let's Connect & Collaborate</h3>
        <p className="font-sans text-base sm:text-xl font-light text-slate-700 dark:text-slate-300 max-w-xl mx-auto mb-10">
          Open for full-stack architecture roles, AI initiatives, and strategic engineering projects.
        </p>
        <div className="flex flex-wrap justify-center gap-4">
          <Button href={`mailto:${data.email}`} variant="primary" size="lg" leftIcon={<i className="fas fa-envelope"></i>}>
            Send Email
          </Button>
          <Button href={data.linkedin} variant="outline" size="lg" leftIcon={<i className="fab fa-linkedin"></i>}>

    // --- NAVIGATION BAR WITH MOBILE DROPDOWN ---
    const NavBar = ({ sections, isDarkMode, toggleDarkMode }) => {
      const [scrolled, setScrolled] = useState(false);
      const [mobileOpen, setMobileOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <nav className={`fixed top-5 left-1/2 -translate-x-1/2 z-50 transition-all duration-500 w-[95%] max-w-6xl rounded-3xl ${scrolled ? 'tilt-glass-card py-2.5 px-6 shadow-2xl' : 'bg-transparent py-4 px-6'}`}>
          <div className="flex justify-between items-center w-full">
            <a href="#" className="font-display font-extrabold text-xl tracking-tighter text-slate-900 dark:text-white shrink-0 mr-6">
              RS.
            </a>

            {/* Desktop Navigation */}
            <div className="hidden lg:flex items-center space-x-5 text-xs font-display font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 py-1">
              {sections.map(s => (
                <a key={s.id} href={`#${s.id}`} className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors whitespace-nowrap">
                  {s.title}
                </a>
              ))}
            </div>

            <div className="flex items-center gap-2">
              {/* Mobile Hamburger Button */}
              <button
                onClick={() => setMobileOpen(!mobileOpen)}
                className="lg:hidden w-10 h-10 aspect-square rounded-full apple-glass-button flex items-center justify-center text-slate-800 dark:text-slate-200"
                aria-label="Toggle Mobile Menu"
              >
                <i className={`fas ${mobileOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
              </button>

              {/* Theme Toggle Button */}
              <button
                onClick={toggleDarkMode}
                className="w-10 h-10 aspect-square rounded-full apple-glass-button flex items-center justify-center text-slate-800 dark:text-slate-200 hover:scale-110 transition-transform shrink-0"
                aria-label="Toggle Theme"
                title={isDarkMode ? "Switch to Day Mode" : "Switch to Night Mode"}
              >
                <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-600'} text-sm`}></i>
              </button>
            </div>
          </div>

          {/* Mobile Dropdown Menu Drawer */}
          {mobileOpen && (
            <div className="lg:hidden mt-4 pt-4 border-t border-black/10 dark:border-white/10 flex flex-col gap-3 font-display font-bold text-sm uppercase tracking-wider text-slate-800 dark:text-slate-200">
              {sections.map(s => (
                <a
                  key={s.id}
                  href={`#${s.id}`}
                  onClick={() => setMobileOpen(false)}
                  className="px-4 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 transition-colors"
                >
                  {s.title}
                </a>
              ))}
            </div>
          )}
        </nav>
      );
    };

    // --- MAIN APP COMPONENT ---
    const App = () => {
      const { isDarkMode, toggleDarkMode } = useDarkMode();
      const { isLoading } = useLoading(3000);
      const [visitorCount, setVisitorCount] = useState(null);
      const [modalState, setModalState] = useState({ isOpen: false, type: null, data: null });

      const openModal = (type, data) => setModalState({ isOpen: true, type, data });
      const closeModal = () => setModalState({ isOpen: false, type: null, data: null });

      // Interactive Canvas Fluid Physics Initialization
      useEffect(() => {
        const canvas = document.getElementById('fluid-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        class Particle {
          constructor() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.radius = Math.random() * 140 + 80;
            this.vx = (Math.random() - 0.5) * 0.8;
            this.vy = (Math.random() - 0.5) * 0.8;
            this.color = Math.random() > 0.5 ? 'rgba(59, 130, 246, 0.22)' : 'rgba(168, 85, 247, 0.18)';
          }

          update(mouse) {
            this.x += this.vx;
            this.y += this.vy;

            if (this.x < -this.radius) this.x = width + this.radius;
            if (this.x > width + this.radius) this.x = -this.radius;
            if (this.y < -this.radius) this.y = height + this.radius;
            if (this.y > height + this.radius) this.y = -this.radius;

            if (mouse.x !== null) {
              const dx = mouse.x - this.x;
              const dy = mouse.y - this.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 250) {
                this.x -= (dx / dist) * 2;
                this.y -= (dy / dist) * 2;
              }
            }
          }

          draw() {
            ctx.beginPath();
            const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);
            grad.addColorStop(0, this.color);
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        const particles = Array.from({ length: 8 }, () => new Particle());
        const mouse = { x: null, y: null };

        const handleMouseMove = (e) => {
          mouse.x = e.clientX;
          mouse.y = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        const render = () => {
          ctx.clearRect(0, 0, width, height);
          particles.forEach(p => {
            p.update(mouse);
            p.draw();
          });
          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      useEffect(() => {
        const fetchVisitorCount = async () => {
          try {
            const response = await fetch('https://api.countapi.xyz/hit/rohithkumarsaravanan-portfolio/visits');
            const data = await response.json();
            setVisitorCount(data.value);
          } catch (error) {
            setVisitorCount('1,250+');
          }
        };
        fetchVisitorCount();
      }, []);

      const renderModalContent = () => {
        if (!modalState.isOpen || !modalState.data) return null;

        switch (modalState.type) {
          case ModalType.EDUCATION:
            const edu = modalState.data;
            return (
              <div className="space-y-6 text-slate-800 dark:text-slate-200">
                <div className="flex items-center gap-4">
                  {edu.logoUrl && <ProtectedImage src={edu.logoUrl} alt={edu.title} className="w-16 h-16 object-contain rounded-xl bg-white p-2 border border-slate-200" />}
                  <div>
                    <h4 className="font-display font-bold text-xl text-slate-900 dark:text-white">{edu.title}</h4>
                    {edu.institution && <p className="text-sm font-medium">{edu.institution}</p>}
                    {edu.date && <p className="text-xs font-mono opacity-60">{edu.date}</p>}
                  </div>
                </div>

                {edu.description && <p className="text-sm sm:text-base leading-relaxed">{edu.description}</p>}

                {edu.achievements && (
                  <div>
                    <h5 className="font-display font-bold text-sm uppercase tracking-wider mb-2 text-blue-600 dark:text-blue-400">Key Achievements</h5>
                    <ul className="list-disc pl-5 text-sm space-y-1">
                      {edu.achievements.map((ach, idx) => <li key={idx}>{ach}</li>)}
                    </ul>
                  </div>
                )}

                {edu.responsibilities && (
                  <div className="space-y-3">
                    <h5 className="font-display font-bold text-sm uppercase tracking-wider text-blue-600 dark:text-blue-400">Responsibilities & Contributions</h5>
                    {edu.responsibilities.map((resp, idx) => (
                      <div key={idx} className="p-3 rounded-xl bg-black/5 dark:bg-white/5 text-xs sm:text-sm leading-relaxed">
                        {resp}
                      </div>
                    ))}
                  </div>
                )}

                {edu.researchLinks && (
                  <div>
                    <h5 className="font-display font-bold text-sm uppercase tracking-wider mb-2 text-blue-600 dark:text-blue-400">Research Publications</h5>
                    <ul className="space-y-2 text-sm">
                      {edu.researchLinks.map((link, idx) => (
                        <li key={idx}>
                          <a href={link.url} target="_blank" rel="noopener noreferrer" className="text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-2">
                            <i className="fas fa-file-alt"></i> {link.text}
                          </a>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}

                {edu.documents && (
                  <div>
                    <h5 className="font-display font-bold text-sm uppercase tracking-wider mb-3 text-blue-600 dark:text-blue-400">Verified Credentials & Transcripts</h5>
                    <div className="flex flex-wrap gap-4">
                      {edu.documents.map((doc, idx) => (
                        <div key={idx} className="cursor-pointer group" onClick={() => openModal(ModalType.IMAGE, { src: doc.largeUrl, alt: doc.alt })}>
                          <p className="text-xs font-semibold mb-1">{doc.name}</p>
                          <ProtectedImage src={doc.thumbnailUrl} alt={doc.alt} className="h-40 rounded-xl border border-slate-300 dark:border-slate-700 group-hover:scale-105 transition-transform" />
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );

          case ModalType.IMAGE:
            return (
              <div className="flex flex-col items-center justify-center relative">
                <ProtectedImage 
                  src={modalState.data.src} 
                  alt={modalState.data.alt} 
                  className="max-w-full max-h-[70vh] rounded-2xl shadow-2xl" 
                  showWatermark={true}
                />
              </div>
            );

          default:
            return null;
        }
      };

      const sections = [
        { id: "about", title: "About", iconClass: "fas fa-user-check", Comp: AboutSection, props: { data: ABOUT_DATA } },
        { id: "publications", title: "Publications", iconClass: "fas fa-book-open", Comp: PublicationsSection, props: { publications: PUBLICATIONS_DATA } },
        { id: "journey", title: "Journey", iconClass: "fas fa-route", Comp: JourneySection, props: { data: JOURNEY_DATA, openModal: (d) => openModal(ModalType.EDUCATION, d) } },
        { id: "skills", title: "Skills", iconClass: "fas fa-code", Comp: SkillsSection, props: { skills: SKILLS_DATA } },
        { id: "certificates", title: "Certificates", iconClass: "fas fa-certificate", Comp: CertificatesSection, props: { data: CERTIFICATES_DATA, openModal: (cert) => openModal(ModalType.IMAGE, { src: cert.imageUrl, alt: cert.title }) } },
        { id: "projects", title: "Projects", iconClass: "fas fa-project-diagram", Comp: ProjectsSection, props: { data: PROJECTS_DATA } },
        { id: "blog", title: "Blog", iconClass: "fas fa-blog", Comp: BlogSection, props: { data: BLOG_POSTS_DATA } },
        { id: "extra-curricular", title: "Activities", iconClass: "fas fa-running", Comp: ExtraCurricularSection, props: { data: EXTRA_CURRICULAR_DATA, visitorCount } },
        { id: "contact", title: "Contact", iconClass: "fas fa-envelope", Comp: ContactSection, props: { data: CONTACT_INFO_DATA } },
      ];

      if (isLoading) {
        return <LoadingSpinner />;
      }

      return (
        <div className="min-h-screen relative">
          <NavBar sections={sections} isDarkMode={isDarkMode} toggleDarkMode={toggleDarkMode} />

          <div className="container mx-auto px-4 sm:px-8 max-w-6xl relative z-10 pt-10">
            <Header profileData={PROFILE_DATA} onContactClick={() => document.getElementById('contact')?.scrollIntoView({ behavior: 'smooth' })} />

            {sections.map(({ id, title, iconClass, Comp, props }) => (
              <section key={id} id={id} className="mb-24 sm:mb-32">
                <SectionHeader title={title} subtitle={id.toUpperCase()} iconClass={iconClass} />
                <Comp {...props} />
              </section>
            ))}

            <footer className="py-12 border-t border-black/10 dark:border-white/10 text-center font-mono text-slate-600 dark:text-slate-400">
              <p className="mb-6 text-base sm:text-lg font-semibold">&copy; {new Date().getFullYear()} {PROFILE_DATA.name}.</p>
              <div className="flex justify-center space-x-8 text-2xl mb-4">
                {FOOTER_SOCIAL_LINKS.map(link => (
                  <a key={link.name} href={link.url} target="_blank" rel="noopener noreferrer" className="hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
                    <i className={link.iconClass}></i>
                  </a>
                ))}
              </div>
            </footer>
          </div>

          <a
            href="index_old.html"
            className="fixed bottom-6 left-6 z-50 px-4 py-3 rounded-full apple-glass-button flex items-center gap-2 text-xs font-display font-semibold text-slate-800 dark:text-slate-200 shadow-2xl hover:scale-105 transition-all duration-300"
            title="Go back to old website"
          >
            <i className="fas fa-arrow-left text-sm"></i>
            <span>Old Website</span>
          </a>

          <ScrollToTopButton />

          <Modal isOpen={modalState.isOpen} onClose={closeModal} title={modalState.type === ModalType.EDUCATION ? modalState.data?.title : "Preview"}>
            {renderModalContent()}
          </Modal>
        </div>
      );
    };

    const rootElement = document.getElementById('root');
    if (rootElement) {
      ReactDOM.createRoot(rootElement).render(<App />);
    }
  </script>
